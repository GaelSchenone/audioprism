[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioprism"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "PySide6>=6.6",
    "moderngl>=5.10",
    "opencv-python>=4.9",
    "pyrr>=0.10",
]

[project.scripts]
audioprism = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
